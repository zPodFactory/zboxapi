[project]
name = "zboxapi"
version = "0.2.0"
description = "zPodFactory zBox API: DNS and VLAN management for the zbox VM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Kelby Valenti", email = "kelby.valenti@gmail.com" },
    { name = "Timo Sugliani", email = "timo.sugliani@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.12",
    "uvicorn>=0.37",
]

[project.urls]
Homepage = "https://github.com/zPodFactory/zboxapi"
Repository = "https://github.com/zPodFactory/zboxapi"
Changelog = "https://github.com/zPodFactory/zboxapi/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zPodFactory/zboxapi#readme"
Issues = "https://github.com/zPodFactory/zboxapi/issues"

[project.scripts]
zboxapi = "zboxapi.main:launch"

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "ipython>=8.24",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["zboxapi"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",
]
